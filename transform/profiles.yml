deeptrace:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5434') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'deeptrace_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'deeptrace_password') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'deeptrace') }}"
      schema: public
      threads: 4
      keepalives_idle: 0